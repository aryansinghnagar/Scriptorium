app-id: org.arsarcanum.ArsArcanum
runtime: org.gnome.Platform
runtime-version: '46'
sdk: org.gnome.Sdk
command: arcanum
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=x11
  # PKG-03: `~/...` tilde forms are deprecated; Ars Arcanum manages whole
  # author trees (~/Universes, ~/Manuscripts, ~/Worlds legacy) plus Git
  # metadata, so a scoped `home` grant replaces the two tilde grants.
  - --filesystem=home
  - --filesystem=xdg-desktop:ro
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: ars-arcanum
    buildsystem: simple
    build-commands:
      - mkdir -p /app/share/ars-arcanum/scripts/lib
      - mkdir -p /app/share/ars-arcanum/templates
      - mkdir -p /app/share/ars-arcanum/configs
      - mkdir -p /app/share/applications
      - mkdir -p /app/bin
      - cp -r scripts/* /app/share/ars-arcanum/scripts/
      # PKG-03: strip bytecode for reproducible packages.
      - find /app/share/ars-arcanum -type d -name '__pycache__' -prune -exec rm -rf {} + ; find /app/share/ars-arcanum -type f -name '*.py[co]' -delete
      - chmod +x /app/share/ars-arcanum/scripts/*.sh
      - chmod +x /app/share/ars-arcanum/scripts/arcanum
      - chmod +x /app/share/ars-arcanum/scripts/ars-arcanum
      - chmod +x /app/share/ars-arcanum/scripts/arcanum_app.py
      - cp -r templates/* /app/share/ars-arcanum/templates/
      - cp -r configs/* /app/share/ars-arcanum/configs/
      # PKG-02: generate Flatpak-native launchers calling /app/bin/arcanum
      # so the installed .desktop files never contain __PROJECT_ROOT__.
      - |
        for f in launchers/*.desktop; do
          base=$(basename "$f")
          case "$base" in
            arcanum-control-center.desktop|ars-arcanum-control-center.desktop|scriptorium-control-center.desktop) sub="control-center";;
            arcanum-worldbuilding.desktop) sub="gui --tab worldbuilding";;
            arcanum-drafting.desktop) sub="gui --tab drafting";;
            arcanum-publishing.desktop) sub="gui --tab publishing";;
            arcanum-comparator.desktop) sub="compare";;
            arcanum-doctor.desktop) sub="doctor";;
            init-world.desktop) sub="world";;
            init-manuscript.desktop) sub="manuscript";;
            export-book.desktop) sub="export";;
            save-snapshot.desktop) sub="snapshot";;
            *) sub="";;
          esac
          if [ -n "$sub" ]; then
            sed -e "s|^Exec=.*|Exec=/app/bin/arcanum $sub|" -e "s|^TryExec=.*|TryExec=/app/bin/arcanum|" "$f" > "/app/share/applications/$base"
          else
            sed -e "s|__PROJECT_ROOT__|/app/share/ars-arcanum|g" "$f" > "/app/share/applications/$base"
          fi
        done
        ! grep -r "__PROJECT_ROOT__" /app/share/applications/ || (echo "ERROR: __PROJECT_ROOT__ survived Flatpak launcher substitution" >&2; exit 1)
      - ln -s /app/share/ars-arcanum/scripts/arcanum /app/bin/arcanum
      - ln -s /app/share/ars-arcanum/scripts/ars-arcanum /app/bin/ars-arcanum
    sources:
      - type: dir
        path: .
