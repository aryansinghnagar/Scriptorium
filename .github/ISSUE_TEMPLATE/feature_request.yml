name: "Feature Request"
description: "Suggest an idea or enhancement for Ars Arcanum."
title: "[Feature]: "
labels: ["enhancement", "proposal"]
body:
  - type: markdown
    attributes:
      value: |
        We welcome author ideas and workflow enhancements! Ars Arcanum operates on a zero-external-dependency, 100% offline privacy architecture.
  - type: textarea
    id: problem
    attributes:
      label: "Problem Statement"
      description: "Is your feature request related to a specific authoring friction or workflow limitation?"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: "Proposed Solution / Workflow"
      description: "Describe how you envision the new feature or craft engine functioning."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives Considered"
      description: "Any alternative tools or workflows you have tried or considered."
    validations:
      required: false
