name: Scriptorium CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    # C-03: weekly drift detection — catches action/toolchain rot between
    # pushes (e.g. Typst/runner updates breaking the template).
    - cron: '23 4 * * 1'

# C-03: least privilege — this workflow only needs to read the repository.
permissions:
  contents: read

jobs:
  verify:
    name: Lint, Validate & Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck desktop-file-utils pandoc libxml2-utils

      - name: Set up Typst
        uses: typst-community/setup-typst@65c09e3962657e3f60f6d8959fbcfeecbb327e58 # v4.0.1
        with:
          # DEP-01: exact pin matching dependencies.lock + setup_scriptorium.sh
          # (0.13.0). Bump deliberately after testing
          # (templates/typst/book_template.typ + preview_sample.typ), never
          # via 'latest' or floating minor — a silent toolchain bump can break
          # CI non-deterministically.
          typst-version: '0.13.0'

      - name: Print environment and tool versions
        run: |
          bash --version | head -n 1
          python3 --version
          pandoc --version | head -n 2
          typst --version
          shellcheck --version
          desktop-file-validate --version

      - name: Gitleaks secret scanning
        uses: gitleaks/gitleaks-action@7ef8627b5e406aa84360e290f6797a14e9f5b6f3 # v2.3.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Python security & static analysis (ruff)
        run: |
          pip install ruff
          ruff check .

      - name: Run Python unit tests
        run: |
          python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Bash syntax validation (bash -n)
        run: |
          status=0
          for f in scripts/*.sh scripts/lib/*.sh scripts/scriptorium tests/*.sh; do
            [ -f "$f" ] || continue
            if ! bash -n "$f"; then
              echo "  FAIL $f (bash syntax)" >&2
              status=1
            else
              echo "  OK $f"
            fi
          done
          exit $status

      - name: ShellCheck static analysis
        run: |
          # C-01: tests/ contain the same risky patterns as the main scripts;
          # lib/ joined the tree with the Q-01 refactor.
          shellcheck -S warning scripts/*.sh scripts/lib/*.sh scripts/scriptorium tests/*.sh

      - name: Validate desktop launcher entries
        run: |
          desktop-file-validate launchers/*.desktop

      # TST-01 / PKG-02: packaging is inside the verification boundary —
      # the broken-launcher class must fail CI, not just source validation.
      - name: Validate packaged launcher substitution (no placeholders)
        run: |
          echo "--- source launchers use __PROJECT_ROOT__ placeholder (expected) ---"
          grep -l "__PROJECT_ROOT__" launchers/*.desktop
          echo "--- simulate debian/rules substitution ---"
          mkdir -p /tmp/pkg-test/applications
          for f in launchers/*.desktop; do
            base=$(basename "$f")
            case "$base" in
              scriptorium-control-center.desktop) sub="control-center";;
              init-world.desktop) sub="world";;
              init-manuscript.desktop) sub="manuscript";;
              export-book.desktop) sub="export";;
              save-snapshot.desktop) sub="snapshot";;
              *) sub="";;
            esac
            if [ -n "$sub" ]; then
              sed -e "s|^Exec=.*|Exec=/usr/bin/scriptorium $sub|" -e "s|^TryExec=.*|TryExec=/usr/bin/scriptorium|" "$f" > "/tmp/pkg-test/applications/$base"
            else
              sed -e "s|__PROJECT_ROOT__|/usr/share/scriptorium|g" "$f" > "/tmp/pkg-test/applications/$base"
            fi
          done
          ! grep -r "__PROJECT_ROOT__" /tmp/pkg-test/applications/ || (echo "ERROR: placeholder survived substitution" >&2; exit 1)
          desktop-file-validate /tmp/pkg-test/applications/*.desktop
          echo "  OK packaged launchers validate with no placeholders"

      - name: Smoke test packaged CLI dispatch via symlink (PKG-01)
        run: |
          mkdir -p /tmp/pkg-test/share/scriptorium /tmp/pkg-test/bin
          cp -r scripts /tmp/pkg-test/share/scriptorium/scripts
          ln -sf /tmp/pkg-test/share/scriptorium/scripts/scriptorium /tmp/pkg-test/bin/scriptorium
          /tmp/pkg-test/bin/scriptorium --version
          /tmp/pkg-test/bin/scriptorium --help > /dev/null
          echo "  OK symlinked CLI dispatches"

      - name: Validate JSON, YAML and XML configurations
        run: |
          python3 -c "import json; json.load(open('configs/leechblock_scriptorium_rules.json')); print('  OK leechblock JSON')"
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('templates/manuscript/nwProject.nwx'); print('  OK nwProject XML')"
          python3 -c "import yaml" 2>/dev/null && python3 -c "import yaml; yaml.safe_load(open('org.scriptorium.Scriptorium.yaml')); print('  OK flatpak manifest YAML')" || python3 -c "
          import re,sys
          t=open('org.scriptorium.Scriptorium.yaml').read()
          assert 'app-id: org.scriptorium.Scriptorium' in t, 'flatpak app-id missing'
          assert '__PROJECT_ROOT__' not in t, 'placeholder leaked into flatpak manifest'
          assert '/app/bin/scriptorium' in t, 'flatpak CLI symlink missing'
          print('  OK flatpak manifest (structural check)')"

      - name: Run verification harness (scripts/verify.sh)
        run: |
          bash scripts/verify.sh

      - name: Run regression test suites (tests/*.sh)
        run: |
          for test_script in tests/*.sh; do
            [ -f "$test_script" ] || continue
            echo "Running test suite: $test_script"
            bash "$test_script"
          done

      - name: Smoke test Typst book preview compilation
        run: |
          typst compile templates/typst/preview_sample.typ /tmp/scriptorium-preview.pdf
          ls -lh /tmp/scriptorium-preview.pdf

      - name: Smoke test Pandoc Markdown to Typst conversion
        run: |
          pandoc -f markdown-citations+smart -t typst templates/manuscript/Book-01/01_Act_I/01_Chapter_01.md -o /tmp/chapter1.typ
          head -n 25 /tmp/chapter1.typ
